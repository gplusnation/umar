<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kajian Fiqih — Ust. Umar Abu Abdillah</title>

  <meta
    name="description"
    content="Kajian fiqih bersama Ust. Umar Abu Abdillah."
  >

  <style>
    :root {
      --green-950: #031b12;
      --green-900: #06291b;
      --green-800: #083b27;
      --green-700: #0b5135;
      --gold: #d8b15a;
      --gold-light: #f1d486;
      --cream: #f8f4e8;
      --text: #173328;
      --muted: #718078;
      --white: #ffffff;
      --border: rgba(216, 177, 90, .20);
      --shadow: 0 15px 45px rgba(0, 0, 0, .12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          circle at top right,
          rgba(216, 177, 90, .08),
          transparent 30%
        ),
        var(--cream);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      /* space for fixed player */
      padding-bottom: 115px;
    }

    /* =========================
       HEADER
    ========================= */

    .hero {
      background:
        radial-gradient(
          circle at 85% 10%,
          rgba(216,177,90,.16),
          transparent 25%
        ),
        linear-gradient(
          135deg,
          var(--green-950),
          var(--green-800)
        );

      color: white;
      padding: 38px 20px 45px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      border: 1px solid rgba(216,177,90,.18);
      border-radius: 50%;
      right: -100px;
      bottom: -120px;
    }

    .hero-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 24px;
      position: relative;
      z-index: 2;
    }

    .profile {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--gold);
      box-shadow:
        0 0 0 6px rgba(216,177,90,.10),
        0 12px 35px rgba(0,0,0,.30);
      flex-shrink: 0;
    }

    .eyebrow {
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.1;
    }

    .speaker {
      margin: 10px 0 0;
      color: rgba(255,255,255,.78);
      font-size: 15px;
    }

    /* =========================
       CONTENT
    ========================= */

    main {
      max-width: 900px;
      margin: auto;
      padding: 28px 16px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 21px;
      color: var(--green-900);
    }

    .count {
      font-size: 12px;
      color: var(--muted);
      background: rgba(6,41,27,.07);
      padding: 7px 10px;
      border-radius: 999px;
    }

    /* =========================
       AUDIO LIST
    ========================= */

    .audio-list {
      display: grid;
      gap: 10px;
    }

    .audio-item {
      width: 100%;
      border: 1px solid rgba(6,41,27,.08);
      background: white;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      box-shadow: 0 5px 20px rgba(0,0,0,.04);
      transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
    }

    .audio-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--border);
    }

    .audio-item.active {
      border-color: var(--gold);
      background:
        linear-gradient(
          90deg,
          rgba(216,177,90,.10),
          white
        );
    }

    .audio-number {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--green-900);
      color: var(--gold-light);
      font-weight: 800;
      flex-shrink: 0;
    }

    .audio-item.active .audio-number {
      background: var(--gold);
      color: var(--green-950);
    }

    .audio-info {
      min-width: 0;
      flex: 1;
    }

    .audio-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .audio-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .play-small {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      background: rgba(6,41,27,.08);
      color: var(--green-900);
      display: grid;
      place-items: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .audio-item.active .play-small {
      background: var(--green-900);
      color: var(--gold-light);
    }

    /* =========================
       LOADING / ERROR
    ========================= */

    .status {
      text-align: center;
      padding: 45px 20px;
      color: var(--muted);
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto 12px;
      border: 3px solid rgba(6,41,27,.12);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       PAGINATION
    ========================= */

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 25px;
    }

    .page-btn {
      min-width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(6,41,27,.10);
      background: white;
      color: var(--green-900);
      font-weight: 700;
      cursor: pointer;
    }

    .page-btn:hover {
      border-color: var(--gold);
    }

    .page-btn.active {
      background: var(--green-900);
      color: var(--gold-light);
      border-color: var(--green-900);
    }

    .page-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    /* =========================
       FIXED AUDIO PLAYER
    ========================= */

    .player {
      position: fixed;
      z-index: 1000;
      left: 0;
      right: 0;
      bottom: 0;

      background:
        linear-gradient(
          135deg,
          rgba(3,27,18,.98),
          rgba(8,59,39,.98)
        );

      color: white;
      border-top: 1px solid rgba(216,177,90,.25);
      box-shadow: 0 -10px 40px rgba(0,0,0,.20);
      backdrop-filter: blur(15px);
    }

    .player-inner {
      max-width: 1000px;
      margin: auto;
      padding: 10px 14px 12px;

      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .now-playing {
      min-width: 0;
    }

    .now-label {
      color: var(--gold-light);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 700;
    }

    .now-title {
      font-weight: 700;
      font-size: 13px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .control {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      background: rgba(255,255,255,.09);
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 15px;
    }

    .control:hover {
      background: rgba(216,177,90,.22);
    }

    .control.main {
      width: 45px;
      height: 45px;
      background: var(--gold);
      color: var(--green-950);
      font-size: 17px;
    }

    .progress-row {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 10px;
      color: rgba(255,255,255,.65);
    }

    .progress {
      flex: 1;
      accent-color: var(--gold);
      cursor: pointer;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      .hero {
        padding: 28px 16px 32px;
      }

      .hero-inner {
        gap: 16px;
      }

      .profile {
        width: 82px;
        height: 82px;
      }

      .speaker {
        font-size: 13px;
      }

      main {
        padding: 22px 12px;
      }

      .audio-item {
        padding: 12px;
      }

      .audio-number {
        width: 40px;
        height: 40px;
      }

      .player-inner {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .player-controls {
        justify-content: center;
      }

      .progress-row {
        grid-row: 1;
      }

      .now-playing {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header class="hero">
    <div class="hero-inner">

      <img
        class="profile"
        src="https://raw.githubusercontent.com/gplusnation/umar/refs/heads/main/0eb61ad5-7fc8-4815-9fae-a48617ff5ec0.png"
        alt="Ust. Umar Abu Abdillah"
      >

      <div>
        <div class="eyebrow">Syarah Aqidah</div>

        <h1>Ahlissunnati Wal Jamaah</h1>

        <p class="speaker">
          Pemateri: Ust. Umar Abu Abdillah
        </p>
      </div>

    </div>
  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <div class="section-heading">
      <h2>Daftar Audio</h2>
      <div class="count" id="count">
        Memuat...
      </div>
    </div>

    <div id="audioList" class="audio-list">

      <div class="status">
        <div class="spinner"></div>
        Memuat daftar audio...
      </div>

    </div>

    <div
      id="pagination"
      class="pagination"
      aria-label="Navigasi halaman"
    ></div>

  </main>


  <!-- =========================
       BOTTOM AUDIO PLAYER
  ========================= -->

  <div class="player">

    <div class="player-inner">

      <div class="now-playing">

        <div class="now-label">
          Sedang diputar
        </div>

        <div
          id="nowTitle"
          class="now-title"
        >
          Pilih audio
        </div>

      </div>


      <div class="player-controls">

        <button
          class="control"
          id="prevBtn"
          aria-label="Audio sebelumnya"
          title="Sebelumnya"
        >
          ⏮
        </button>

        <button
          class="control main"
          id="playBtn"
          aria-label="Putar"
          title="Putar"
        >
          ▶
        </button>

        <button
          class="control"
          id="nextBtn"
          aria-label="Audio berikutnya"
          title="Berikutnya"
        >
          ⏭
        </button>

      </div>


      <div class="progress-row">

        <span id="currentTime">
          0:00
        </span>

        <input
          type="range"
          id="progress"
          class="progress"
          min="0"
          max="100"
          value="0"
        >

        <span id="duration">
          0:00
        </span>

      </div>

    </div>

  </div>


  <!-- AUDIO ELEMENT -->

  <audio
    id="audio"
    preload="metadata"
  ></audio>


  <script>

    /*
     * ==========================================
     * KONFIGURASI
     * ==========================================
     */

    const REPO_API =
      "https://api.github.com/repos/gplusnation/umar/contents/audio?ref=main";

    const RAW_BASE =
      "https://raw.githubusercontent.com/gplusnation/umar/main/audio/";

    const PER_PAGE = 10;


    /*
     * ==========================================
     * STATE
     * ==========================================
     */

    let audios = [];

    let currentIndex = -1;

    let currentPage = 1;


    /*
     * ==========================================
     * ELEMENT
     * ==========================================
     */

    const audio =
      document.getElementById("audio");

    const audioList =
      document.getElementById("audioList");

    const pagination =
      document.getElementById("pagination");

    const count =
      document.getElementById("count");

    const nowTitle =
      document.getElementById("nowTitle");

    const playBtn =
      document.getElementById("playBtn");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const progress =
      document.getElementById("progress");

    const currentTime =
      document.getElementById("currentTime");

    const duration =
      document.getElementById("duration");


    /*
     * ==========================================
     * LOAD AUDIO DARI GITHUB
     * ==========================================
     */

    async function loadAudios() {

      try {

        const response =
          await fetch(REPO_API);

        if (!response.ok) {
          throw new Error(
            "Gagal mengambil data GitHub"
          );
        }

        const files =
          await response.json();


        /*
         * Hanya file audio.
         */

        const audioExtensions = [
          ".mp3",
          ".m4a",
          ".aac",
          ".wav",
          ".ogg",
          ".oga",
          ".webm",
          ".flac"
        ];


        audios = files
          .filter(file => {

            if (file.type !== "file") {
              return false;
            }

            const name =
              file.name.toLowerCase();

            return audioExtensions.some(
              extension =>
                name.endsWith(extension)
            );

          })
          .sort((a, b) =>
            a.name.localeCompare(
              b.name,
              undefined,
              {
                numeric: true,
                sensitivity: "base"
              }
            )
          )
          .map((file, index) => ({

            id: index,

            /*
             * Nama yang ditampilkan
             * selalu Audio 1, Audio 2, dst.
             */

            title:
              `Audio ${index + 1}`,

            filename:
              file.name,

            url:
              file.download_url ||
              RAW_BASE +
              encodeURIComponent(file.name)

          }));


        count.textContent =
          `${audios.length} audio`;


        if (audios.length === 0) {

          audioList.innerHTML = `
            <div class="status">
              Tidak ditemukan file audio
              di folder repository.
            </div>
          `;

          return;
        }


        renderPage(1);

      } catch (error) {

        console.error(error);

        audioList.innerHTML = `
          <div class="status">
            <strong>Gagal memuat audio.</strong>
            <br><br>
            Pastikan repository GitHub
            dapat diakses secara publik.
          </div>
        `;

        count.textContent =
          "Gagal memuat";

      }

    }


    /*
     * ==========================================
     * RENDER HALAMAN
     * ==========================================
     */

    function renderPage(page) {

      currentPage = page;

      const start =
        (page - 1) * PER_PAGE;

      const end =
        start + PER_PAGE;

      const pageAudios =
        audios.slice(start, end);


      audioList.innerHTML = "";


      pageAudios.forEach(
        (item, localIndex) => {

          const globalIndex =
            start + localIndex;

          const button =
            document.createElement("button");

          button.className =
            "audio-item";

          if (globalIndex === currentIndex) {
            button.classList.add("active");
          }


          button.innerHTML = `

            <div class="audio-number">
              ${globalIndex + 1}
            </div>

            <div class="audio-info">

              <div class="audio-title">
                ${item.title}
              </div>

              <div class="audio-meta">
                Kajian Fiqih ·
                Ust. Umar Abu Abdillah
              </div>

            </div>

            <div class="play-small">
              ${
                globalIndex === currentIndex &&
                !audio.paused
                  ? "❚❚"
                  : "▶"
              }
            </div>

          `;


          button.addEventListener(
            "click",
            () => playAudio(globalIndex)
          );


          audioList.appendChild(button);

        }
      );


      renderPagination();


      /*
       * Jika audio yang sedang diputar
       * berada di halaman ini,
       * scroll sedikit agar terlihat.
       */

      if (
        currentIndex >= start &&
        currentIndex < end
      ) {

        const active =
          audioList.querySelector(
            ".active"
          );

        if (active) {
          active.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
          });
        }

      }

    }


    /*
     * ==========================================
     * PAGINATION
     * ==========================================
     */

    function renderPagination() {

      pagination.innerHTML = "";


      const totalPages =
        Math.ceil(
          audios.length / PER_PAGE
        );


      if (totalPages <= 1) {
        return;
      }


      /*
       * Previous
       */

      const prev =
        createPageButton(
          "‹",
          currentPage - 1
        );

      prev.disabled =
        currentPage === 1;

      pagination.appendChild(prev);


      /*
       * Nomor halaman
       */

      for (
        let page = 1;
        page <= totalPages;
        page++
      ) {

        const button =
          createPageButton(
            page,
            page
          );

        if (page === currentPage) {
          button.classList.add("active");
        }

        pagination.appendChild(button);

      }


      /*
       * Next
       */

      const next =
        createPageButton(
          "›",
          currentPage + 1
        );

      next.disabled =
        currentPage === totalPages;

      pagination.appendChild(next);

    }


    function createPageButton(
      label,
      page
    ) {

      const button =
        document.createElement("button");

      button.className =
        "page-btn";

      button.textContent =
        label;

      button.addEventListener(
        "click",
        () => {

          renderPage(page);

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );

      return button;

    }


    /*
     * ==========================================
     * PLAY AUDIO
     * ==========================================
     */

    function playAudio(index) {

      if (
        index < 0 ||
        index >= audios.length
      ) {
        return;
      }


      currentIndex = index;

      const item =
        audios[index];


      audio.src =
        item.url;

      audio.load();


      nowTitle.textContent =
        item.title;


      audio.play()
        .then(() => {

          updatePlayButton();

        })
        .catch(error => {

          console.error(
            "Audio gagal diputar:",
            error
          );

          updatePlayButton();

        });


      /*
       * Jika audio berada di halaman lain,
       * pindahkan pagination ke halaman
       * audio tersebut.
       */

      const targetPage =
        Math.floor(
          index / PER_PAGE
        ) + 1;


      if (
        targetPage !== currentPage
      ) {
        currentPage = targetPage;
      }


      renderPage(currentPage);

    }


    /*
     * ==========================================
     * PLAY / PAUSE
     * ==========================================
     */

    playBtn.addEventListener(
      "click",
      () => {

        if (currentIndex === -1) {

          if (audios.length > 0) {
            playAudio(0);
          }

          return;
        }


        if (audio.paused) {

          audio.play();

        } else {

          audio.pause();

        }

      }
    );


    /*
     * ==========================================
     * PREVIOUS
     * ==========================================
     */

    prevBtn.addEventListener(
      "click",
      () => {

        if (audios.length === 0) {
          return;
        }


        let previous =
          currentIndex - 1;


        if (previous < 0) {
          previous = audios.length - 1;
        }


        playAudio(previous);

      }
    );


    /*
     * ==========================================
     * NEXT
     * ==========================================
     */

    nextBtn.addEventListener(
      "click",
      () => {

        if (audios.length === 0) {
          return;
        }


        let next =
          currentIndex + 1;


        if (
          next >= audios.length
        ) {
          next = 0;
        }


        playAudio(next);

      }
    );


    /*
     * ==========================================
     * AUDIO EVENTS
     * ==========================================
     */

    audio.addEventListener(
      "play",
      () => {

        updatePlayButton();

        renderPage(currentPage);

      }
    );


    audio.addEventListener(
      "pause",
      () => {

        updatePlayButton();

        renderPage(currentPage);

      }
    );


    /*
     * Ketika audio selesai,
     * lanjut otomatis ke audio berikutnya.
     */

    audio.addEventListener(
      "ended",
      () => {

        if (audios.length === 0) {
          return;
        }


        let next =
          currentIndex + 1;


        if (
          next >= audios.length
        ) {
          next = 0;
        }


        playAudio(next);

      }
    );


    /*
     * ==========================================
     * PROGRESS
     * ==========================================
     */

    audio.addEventListener(
      "timeupdate",
      () => {

        if (!audio.duration) {
          return;
        }


        progress.value =
          (
            audio.currentTime /
            audio.duration
          ) * 100;


        currentTime.textContent =
          formatTime(
            audio.currentTime
          );

      }
    );


    audio.addEventListener(
      "loadedmetadata",
      () => {

        duration.textContent =
          formatTime(
            audio.duration
          );

      }
    );


    progress.addEventListener(
      "input",
      () => {

        if (!audio.duration) {
          return;
        }


        audio.currentTime =
          (
            progress.value / 100
          ) * audio.duration;

      }
    );


    /*
     * ==========================================
     * UPDATE PLAY BUTTON
     * ==========================================
     */

    function updatePlayButton() {

      playBtn.textContent =
        audio.paused
          ? "▶"
          : "❚❚";

      playBtn.setAttribute(
        "aria-label",
        audio.paused
          ? "Putar"
          : "Jeda"
      );

    }


    /*
     * ==========================================
     * FORMAT DURASI
     * ==========================================
     */

    function formatTime(seconds) {

      if (
        !seconds ||
        !isFinite(seconds)
      ) {
        return "0:00";
      }


      const minutes =
        Math.floor(
          seconds / 60
        );

      const remaining =
        Math.floor(
          seconds % 60
        );


      return `${minutes}:${String(
        remaining
      ).padStart(2, "0")}`;

    }


    /*
     * ==========================================
     * START
     * ==========================================
     */

    loadAudios();

  </script>

</body>
</html>
